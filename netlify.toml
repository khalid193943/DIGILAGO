# =========================================================
# DIGILAGO — configuration Netlify
# =========================================================

[build]
  # Site statique : rien à compiler, on publie le dossier tel quel.
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# La console admin ne doit jamais être indexée par les moteurs.
[[headers]]
  for = "/admin-console-89898zzx.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# En-têtes de sécurité de base sur tout le site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ---------------------------------------------------------
# Anciennes adresses (site v1) → sections de la nouvelle page
# d'accueil. Redirections permanentes : Google transfère le
# référencement acquis et les anciens liens continuent de marcher.
# ---------------------------------------------------------
[[redirects]]
  from = "/pourquoi.html"
  to = "/#presence"
  status = 301
[[redirects]]
  from = "/services.html"
  to = "/#services"
  status = 301
[[redirects]]
  from = "/realisations.html"
  to = "/#realisations"
  status = 301
[[redirects]]
  from = "/tarifs.html"
  to = "/#tarifs"
  status = 301
[[redirects]]
  from = "/a-propos.html"
  to = "/#agence"
  status = 301
[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301
[[redirects]]
  from = "/demarrer.html"
  to = "/#demarrer"
  status = 301

# Netlify sert automatiquement 404.html quand aucune page ne correspond.
# Pas de règle /* ici : elle pourrait interférer avec la route de la
# fonction serveur (/.netlify/functions/submissions).

# ---------------------------------------------------------
# Blocage des aspirateurs de site.
# .htaccess ne fonctionne pas sur Netlify : c'est cette
# fonction de périphérie qui fait le travail.
# ---------------------------------------------------------
[[edge_functions]]
  function = "anti-aspirateur"
  path = "/*"

# ---------------------------------------------------------
# En-têtes de sécurité supplémentaires
# ---------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
